[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "project-xray"
version = "0.3.0"
description = "Universal Project Intelligence and Observability Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Project X-Ray Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.6,<1"]
security = ["bandit>=1.8,<2", "pip-audit>=2.8,<3"]

[project.scripts]
xray = "xray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
